<div class="project-heading"><h1>Project-Verbo</h1></div>

<div class="project-description">
    <p>Welcome to Project-Verbo!</p>
    <p>Ever got tired of typing? Let us help you!</p>
    <p>This application is powered by Token optimization feature which cuts your fillers
         and improves prompt's effectivity and efficiency.</p>
</div>

<div class="Audio">
    <label for="Audio transcription">Audio Transcription</label>
    <button type="button" id="micBtn" style="font-size: 10px; padding: 10px;">
        🎤 Speak
    </button>
    <textarea placeholder="Speak into the button"></textarea>
</div>

<div class="Text">
    <label for="Text transcription">Text Transcription</label>
    <textarea placeholder="Enter your text here" (input)="userText.set($any($event.target).value)"></textarea>
    <button type="button" class="optimize-btn" (click)="optimize()" [disabled]="loading()">
        @if (loading()) { Optimizing... } @else { Optimize }
    </button>
</div>

<div class="gpt-text">
    <label for="Token optimized text">Token Optimized Text</label>
    <textarea placeholder="View Token Optimized text here" [value]="optimizedText()" readonly></textarea>
</div>
