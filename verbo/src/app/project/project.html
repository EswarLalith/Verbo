<div class="project-heading"><h1>Project-Verbo</h1></div>

<div class="project-description">
    <p>Welcome to Project-Verbo!</p>
    <p>Ever got tired of typing? Let us help you!</p>
    <p>This application is powered by Token optimization feature which cuts your fillers
         and improves prompt's effectivity and efficiency.</p>
</div>

<div class="Audio">
    <label>Audio Transcription</label>
    <button type="button" id="micBtn" (click)="toggleRecording()" [disabled]="loading()"
            [class.recording]="recording()">
        @if (recording()) { ⏹ Stop } @else { 🎤 Speak }
    </button>
    <textarea placeholder="Speak into the button" [value]="transcription()" readonly></textarea>
    <button type="button" class="optimize-btn" (click)="optimizeAudio()"
            [disabled]="loading()">
        @if (audioOptimizing()) { Optimizing... } @else { Optimize }
    </button>
</div>

<div class="Text" [class.disabled]="audioBusy()">
    <label>Text Transcription</label>
    <textarea placeholder="Enter your text here"
              (input)="userText.set($any($event.target).value)"
              [readonly]="audioBusy()"></textarea>
    <button type="button" class="optimize-btn" (click)="optimize()"
            [disabled]="loading() || audioBusy()">
        @if (loading() && !audioOptimizing()) { Optimizing... } @else { Optimize }
    </button>
</div>

<div class="gpt-text">
    <label>Token Optimized Text</label>
    <textarea placeholder="View Token Optimized text here" [value]="optimizedText()" readonly></textarea>
</div>
